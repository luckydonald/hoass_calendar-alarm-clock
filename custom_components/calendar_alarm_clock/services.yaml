create_alarm:
  name: Create Alarm
  description: Create a new alarm.
  fields:
    name:
      name: Name
      description: Name of the alarm.
      required: false
      default: "Alarm"
      example: "Wake up"
      selector:
        text:
    time:
      name: Time
      description: Time for the alarm (HH:MM format).
      required: false
      example: "07:30"
      selector:
        time:
    date:
      name: Date
      description: Date for the alarm (YYYY-MM-DD format). Defaults to today.
      required: false
      example: "2026-01-15"
      selector:
        date:
    repeat:
      name: Repeat
      description: Repeat pattern.
      required: false
      default: "none"
      selector:
        select:
          options:
            - "none"
            - "daily"
            - "weekdays"
            - "weekends"
            - "weekly"
    enabled:
      name: Enabled
      description: Whether the alarm is enabled.
      required: false
      default: true
      selector:
        boolean:

delete_alarm:
  name: Delete Alarm
  description: Delete an alarm.
  fields:
    entity_id:
      name: Entity
      description: The alarm entity to delete.
      required: false
      selector:
        entity:
          domain: sensor
          integration: calendar_alarm_clock
    alarm_id:
      name: Alarm ID
      description: The ID of the alarm to delete.
      required: false
      example: "abc123"
      selector:
        text:

