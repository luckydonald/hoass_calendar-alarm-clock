snooze_alarm:
  name: Snooze Alarm
  description: Snooze a ringing alarm.
  fields:
    entity_id:
      name: Entity
      description: The alarm entity to snooze.
      required: false
      selector:
        entity:
          domain: sensor
          integration: calendar_alarm_clock
    alarm_id:
      name: Alarm ID
      description: The ID of the alarm to snooze.
      required: false
      selector:
        text:
    duration:
      name: Duration
      description: Snooze duration in minutes.
      required: false
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: minutes

