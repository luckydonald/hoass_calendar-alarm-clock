name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy homeassistant

      - name: Run Ruff
        run: ruff check custom_components/

      - name: Run Ruff Format Check
        run: ruff format --check custom_components/

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack and prepare Yarn
        run: |
          corepack enable
          # prefer frontend/package.json if present
          if [ -f frontend/package.json ]; then
            pkgfile=frontend/package.json
          elif [ -f package.json ]; then
            pkgfile=package.json
          else
            pkgfile=""
          fi

          if [ -n "$pkgfile" ]; then
            pm=$(node -e "const path=process.argv[1]; const p=require(path.startsWith('./')?path:'./'+path); console.log(p.packageManager||'')" "$pkgfile")
          else
            pm=""
          fi

          echo "Detected packageManager: $pm"

          if echo "$pm" | grep -q '^yarn@'; then
            ver=${pm#yarn@}
            corepack prepare yarn@$ver --activate
          elif [ -z "$pm" ]; then
            echo "No packageManager field found; activating yarn@stable"
            corepack prepare yarn@stable --activate
          else
            echo "packageManager is not yarn (found: $pm); only enabling corepack"
          fi

      - name: Install dependencies
        working-directory: frontend
        run: yarn install

      - name: Type check
        working-directory: frontend
        run: yarn type-check

      - name: Build
        working-directory: frontend
        run: yarn build

  hacs-validate:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

