name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack and prepare Yarn
        run: |
          corepack enable
          # prefer frontend/package.json if present
          if [ -f frontend/package.json ]; then
            pkgfile=frontend/package.json
          elif [ -f package.json ]; then
            pkgfile=package.json
          else
            pkgfile=""
          fi

          if [ -n "$pkgfile" ]; then
            pm=$(node -e "const path=process.argv[1]; const p=require(path.startsWith('./')?path:'./'+path); console.log(p.packageManager||'')" "$pkgfile")
          else
            pm=""
          fi

          echo "Detected packageManager: $pm"

          if echo "$pm" | grep -q '^yarn@'; then
            ver=${pm#yarn@}
            corepack prepare yarn@$ver --activate
          elif [ -z "$pm" ]; then
            echo "No packageManager field found; activating yarn@stable"
            corepack prepare yarn@stable --activate
          else
            echo "packageManager is not yarn (found: $pm); only enabling corepack"
          fi

      - name: Install dependencies
        working-directory: frontend
        run: yarn install

      - name: Build frontend
        working-directory: frontend
        run: yarn build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: custom_components/calendar_alarm_clock/www/alarm-clock-card.js

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: custom_components/calendar_alarm_clock/www/

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update manifest version
        run: |
          sed -i 's/"version": ".*"/"version": "${{ steps.version.outputs.version }}"/' custom_components/calendar_alarm_clock/manifest.json

      - name: Create release zip
        run: |
          # HACS expects zip contents to be extracted directly into custom_components/calendar_alarm_clock/
          # So we zip the contents, not the folder itself
          cd custom_components/calendar_alarm_clock
          zip -r ../../calendar_alarm_clock.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: calendar_alarm_clock.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hacs-validate:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: HACS Validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
